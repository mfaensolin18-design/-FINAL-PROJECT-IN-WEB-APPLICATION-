<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bayanihan Family Clinic – Appointments and Records</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f1;--surface:#fff;--ink:#12312e;--muted:#5b716e;--line:#d3e0dd;--teal:#0f6b66;--teal-ink:#fff;--soft:#dcebe8;--warn:#c4472f;--ok:#2d7a4b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c1b;--surface:#172827;--ink:#e3efec;--muted:#93aaa6;--line:#2a4140;--teal:#4cc2b8;--teal-ink:#0a1a19;--soft:#1f3836;--warn:#ff8a73;--ok:#6fd39a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1c1b;--surface:#172827;--ink:#e3efec;--muted:#93aaa6;--line:#2a4140;--teal:#4cc2b8;--teal-ink:#0a1a19;--soft:#1f3836;--warn:#ff8a73;--ok:#6fd39a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
header{background:var(--teal);color:var(--teal-ink);padding:18px 20px 0}
.wrap{max-width:980px;margin:0 auto}
header h1{margin:0;font-size:1.5rem;letter-spacing:-.01em}
header p{margin:2px 0 14px;opacity:.85;font-size:.95rem}
nav{display:flex;gap:4px;overflow-x:auto}
nav button{background:transparent;color:inherit;border:0;padding:10px 14px;font:inherit;font-weight:500;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;opacity:.8}
nav button[aria-current=true]{background:var(--bg);color:var(--ink);opacity:1}
main{padding:22px 20px 60px}
h2{font-size:1.3rem;margin:0 0 14px}h3{font-size:1.05rem;margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--surface);border-left:5px solid var(--teal);padding:12px 16px;border-radius:6px}
.stat b{display:block;font-size:1.9rem;line-height:1.1}.stat span{color:var(--muted);font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.row:first-of-type{border-top:0}
.time{font-weight:700;min-width:64px}
.grow{flex:1;min-width:160px}.sub{color:var(--muted);font-size:.88rem}
label{display:block;font-weight:500;font-size:.9rem;margin:10px 0 4px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
button.b{background:var(--teal);color:var(--teal-ink);border:0;padding:10px 16px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}
button.g{background:transparent;color:var(--ink);border:1px solid var(--line);padding:6px 10px;border-radius:8px;font:inherit;font-size:.85rem;cursor:pointer}
button.g.d{color:var(--warn)}
:focus-visible{outline:3px solid var(--warn);outline-offset:2px}
.slots{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.slot{padding:8px 12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit}
.slot[aria-pressed=true]{background:var(--teal);color:var(--teal-ink);border-color:var(--teal)}
.slot:disabled{opacity:.35;text-decoration:line-through;cursor:not-allowed}
.tag{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--soft)}
.tag.Completed{color:var(--ok)}.tag.Cancelled{color:var(--warn)}
.tabs2{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs2 button[aria-pressed=true]{background:var(--soft);font-weight:700}
.msg{padding:10px 14px;border-radius:8px;background:var(--soft);margin-bottom:14px}
.err{color:var(--warn)}
.cols{display:grid;grid-template-columns:1fr 1.3fr;gap:18px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.note{border-left:3px solid var(--teal);padding:4px 12px;margin:10px 0}
.sched{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.sched span{padding:3px 10px;border-radius:6px;background:var(--soft);font-size:.85rem}
.sched span.off{opacity:.4}
.btn-theme{float:right;background:transparent;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;font:inherit;font-size:.85rem;cursor:pointer}
@media(prefers-reduced-motion:no-preference){main>div{animation:in .25s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
.printonly{display:none;margin-bottom:10px}
@media print{header,#nav,.noprint,.cols>div:first-child,.rec label,.rec select,.rec textarea,.rec .b{display:none!important}.cols{display:block}body{background:#fff;color:#000}.panel{border:0}.printonly{display:block!important}}
</style>
</head>
<body>
<header><div class="wrap">
<button class="btn-theme" id="theme" aria-label="Switch light or dark theme">Theme</button>
<button class="btn-theme" id="out" hidden style="margin-right:8px">Log out</button><span id="who" style="float:right;margin-right:12px;font-size:.9rem"></span>
<h1>Bayanihan Family Clinic</h1>
<p>Appointments, patient records and doctor schedules in one place</p>
<nav id="nav" aria-label="Sections"></nav>
</div></header>
<main><div class="wrap" id="view"></div></main>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.toISOString().slice(0,10);
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return iso(d)};
const addDays=(n)=>{const d=new Date(today()+'T00:00');d.setDate(d.getDate()+n);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return iso(d)};
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SLOTS=[];for(let h=9;h<17;h++){if(h===12)continue;SLOTS.push(h+':00'.replace(/^(\d):/,'0$1:'),(h+':30'))}
const pad=t=>t.padStart(5,'0');
const fmt=t=>{let[h,m]=t.split(':');h=+h;return(h>12?h-12:h)+':'+m+(h>=12?' PM':' AM')};
const fdate=d=>new Date(d+'T00:00').toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric',year:'numeric'});

function seed(){return{
 doctors:[{id:'d1',name:'Dr. Maria Santos',spec:'Family Medicine',days:[1,2,3,4,5]},{id:'d2',name:'Dr. Jose Reyes',spec:'Pediatrics',days:[1,3,5]},{id:'d3',name:'Dr. Ana Cruz',spec:'Internal Medicine',days:[2,4,6]}],
 patients:[{id:'p1',name:'Liza Mendoza',age:34,phone:'0917 555 0101',notes:[{date:addDays(-20),did:'d1',text:'Seasonal flu. Advised rest and fluids. Paracetamol every 6 hours as needed.'}]},
  {id:'p2',name:'Carlo Dela Peña',age:7,phone:'0918 555 0188',notes:[]},
  {id:'p3',name:'Rodel Bautista',age:58,phone:'0920 555 0144',notes:[{date:addDays(-45),did:'d3',text:'Blood pressure 150/95. Started monitoring. Follow-up in 4 weeks.'}]}],
 appts:[{id:'a1',pid:'p1',did:'d1',date:today(),time:'09:00',reason:'Follow-up check',status:'Scheduled'},
  {id:'a2',pid:'p2',did:'d2',date:today(),time:'10:30',reason:'Vaccination',status:'Scheduled'},
  {id:'a3',pid:'p3',did:'d3',date:addDays(2),time:'14:00',reason:'Blood pressure review',status:'Scheduled'}]}}
let S;try{S=JSON.parse(localStorage.getItem('clinic-v1'))}catch(e){}
if(!S||!S.appts)S=seed();
const save=()=>{try{localStorage.setItem('clinic-v1',JSON.stringify(S))}catch(e){}};
const uid=p=>p+Math.random().toString(36).slice(2,8);
const P=id=>S.patients.find(x=>x.id===id)||{name:'Unknown'};
const D=id=>S.doctors.find(x=>x.id===id)||{name:'Unknown'};
const taken=(did,date,time,skip)=>S.appts.some(a=>a.did===did&&a.date===date&&a.time===time&&a.status!=='Cancelled'&&a.id!==skip);

let tab='dash',draft={did:'d1',date:addDays(1),time:'',pid:S.patients[0]?.id||'new'},msg='',filter='All',selP=null,q='';
const TABS=[['dash','Dashboard'],['book','Book appointment'],['appts','Appointments'],['pts','Patients and records'],['docs','Doctors']];
function nav(){$('#nav').innerHTML=TABS.filter(([k])=>!(role()==='doctor'&&k==='book')).map(([k,l])=>`<button data-t="${k}" aria-current="${tab===k}">${l}</button>`).join('')}
$('#nav').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;msg='';render()}};
$('#theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark'};

function apptRow(a,actions){return`<div class="row"><span class="time">${fmt(a.time)}</span><div class="grow"><b>${esc(P(a.pid).name)}</b><div class="sub">${esc(D(a.did).name)} · ${esc(a.reason||'No reason given')}${actions?' · '+fdate(a.date):''}</div></div><span class="tag ${a.status}">${a.status}</span>${actions&&a.status==='Scheduled'?`<span><button class="g" data-act="done" data-id="${a.id}">Mark completed</button> <button class="g d" data-act="cancel" data-id="${a.id}">Cancel</button></span>`:''}</div>`}

function dash(){const t=today();const td=S.appts.filter(a=>a.date===t&&a.status!=='Cancelled').sort((a,b)=>a.time.localeCompare(b.time));
 const up=S.appts.filter(a=>a.date>t&&a.status==='Scheduled').sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,5);
 return`<h2>Today, ${fdate(t)}</h2><div class="stats"><div class="stat"><b>${td.length}</b><span>Appointments today</span></div><div class="stat"><b>${S.appts.filter(a=>a.date>t&&a.status==='Scheduled').length}</b><span>Upcoming</span></div><div class="stat"><b>${S.patients.length}</b><span>Registered patients</span></div><div class="stat"><b>${S.doctors.filter(d=>d.days.includes(new Date(t+'T00:00').getDay())).length}</b><span>Doctors on duty</span></div></div>
 <div class="panel"><h3>Today's schedule</h3>${td.map(a=>apptRow(a)).join('')||'<p class="sub">No appointments today. Use Book appointment to add one.</p>'}</div>
 <div class="panel"><h3>Next up</h3>${up.map(a=>apptRow(a,1)).join('')||'<p class="sub">Nothing scheduled ahead.</p>'}</div>`}

function book(){const dow=new Date(draft.date+'T00:00').getDay(),doc=D(draft.did),works=doc.days&&doc.days.includes(dow);
 return`<h2>Book an appointment</h2>${msg?`<div class="msg" role="status">${msg}</div>`:''}<div class="panel">
 <div class="grid"><div><label for="bp">Patient</label><select id="bp">${S.patients.map(p=>`<option value="${p.id}" ${draft.pid===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}<option value="new" ${draft.pid==='new'?'selected':''}>New patient…</option></select></div>
 <div><label for="bd">Doctor</label><select id="bd">${S.doctors.map(d=>`<option value="${d.id}" ${draft.did===d.id?'selected':''}>${esc(d.name)} (${esc(d.spec)})</option>`).join('')}</select></div>
 <div><label for="bdt">Date</label><input type="date" id="bdt" min="${today()}" value="${draft.date}"></div></div>
 ${draft.pid==='new'?`<div class="grid"><div><label for="nn">Full name</label><input id="nn" autocomplete="name"></div><div><label for="na">Age</label><input id="na" type="number" min="0" max="120"></div><div><label for="np">Phone</label><input id="np" type="tel"></div></div>`:''}
 <label>Time</label>${works?`<div class="slots">${SLOTS.map(pad).map(t=>`<button type="button" class="slot" data-slot="${t}" aria-pressed="${draft.time===t}" ${taken(draft.did,draft.date,t)?'disabled':''}>${fmt(t)}</button>`).join('')}</div>`:`<p class="err">${esc(doc.name)} does not see patients on ${DAYS[dow]}. Pick another date or doctor.</p>`}
 <label for="br">Reason for visit</label><input id="br" placeholder="e.g. Cough and fever for 3 days">
 <p><button class="b" id="bsave">Confirm appointment</button></p><p class="sub">Struck-through times are already taken.</p></div>`}

function appts(){const list=S.appts.filter(a=>filter==='All'||a.status===filter).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
 return`<h2>Appointments</h2><div class="tabs2">${['All','Scheduled','Completed','Cancelled'].map(f=>`<button class="g" data-f="${f}" aria-pressed="${filter===f}">${f}</button>`).join('')}</div><div class="panel">${list.map(a=>apptRow(a,1)).join('')||'<p class="sub">No appointments match this filter.</p>'}</div>`}

function pts(){const list=S.patients.filter(p=>p.name.toLowerCase().includes(q.toLowerCase()));const p=S.patients.find(x=>x.id===selP);
 return`<h2>Patients and records</h2><div class="cols"><div><div class="panel"><label for="sq">Search patients</label><input id="sq" value="${esc(q)}" placeholder="Type a name">
 ${list.map(x=>`<div class="row"><div class="grow"><b>${esc(x.name)}</b><div class="sub">${x.age} yrs · ${esc(x.phone)}</div></div><button class="g" data-p="${x.id}">Open record</button></div>`).join('')||'<p class="sub">No patient found.</p>'}</div>
 <div class="panel"><h3>Register new patient</h3><label for="rn">Full name</label><input id="rn"><label for="ra">Age</label><input id="ra" type="number" min="0" max="120"><label for="rp">Phone</label><input id="rp" type="tel"><p><button class="b" id="radd">Add patient</button></p></div></div>
 <div class="panel rec">${p?`<div class="printonly"><b>Bayanihan Family Clinic</b>: Patient record</div><button class="g noprint" id="pr" style="float:right">Print record</button><h3>${esc(p.name)}</h3><div class="sub">${p.age} yrs · ${esc(p.phone)}</div><h3 style="margin-top:16px">Visit notes</h3>${p.notes.slice().reverse().map(n=>`<div class="note"><div class="sub">${fdate(n.date)} · ${esc(D(n.did).name)}</div>${esc(n.text)}</div>`).join('')||'<p class="sub">No notes yet.</p>'}
 <label for="nd">Add note from</label><select id="nd">${S.doctors.map(d=>`<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select><label for="nt">Diagnosis and treatment</label><textarea id="nt" rows="3"></textarea><p><button class="b" id="nadd">Save note</button></p>`:'<p class="sub">Select a patient to see their record.</p>'}</div></div>`}

function docs(){return`<h2>Doctors and schedules</h2>${S.doctors.map(d=>`<div class="panel"><h3>${esc(d.name)}</h3><div class="sub">${esc(d.spec)} · 9:00 AM to 5:00 PM, closed 12:00 to 1:00 PM</div><div class="sched">${DAYS.map((n,i)=>`<span class="${d.days.includes(i)?'':'off'}">${n}</span>`).join('')}</div><p class="sub">Booked in the next 7 days: ${S.appts.filter(a=>a.did===d.id&&a.status==='Scheduled'&&a.date>=today()&&a.date<=addDays(7)).length}</p></div>`).join('')}`}

function render(){const L=!user;$('#out').hidden=L;$('#who').textContent=L?'':user.name+' ('+user.role+')';
 if(L){$('#nav').innerHTML='';$('#view').innerHTML='<div>'+loginView()+'</div>';return}
 if(role()==='doctor'&&tab==='book')tab='dash';
 nav();$('#view').innerHTML='<div>'+({dash,book,appts,pts,docs}[tab])()+'</div>';
 if(role()==='doctor'){$('#radd')?.closest('.panel')?.remove()}
 if(role()==='staff'){['label[for=nd]','#nd','label[for=nt]','#nt'].forEach(s=>$(s)?.remove());$('#nadd')?.closest('p')?.remove()}
 else if(user.did&&$('#nd'))$('#nd').value=user.did}
const ACC=[{u:'staff',p:'staff123',role:'staff',name:'Front desk'},{u:'drsantos',p:'doctor123',role:'doctor',name:'Dr. Maria Santos',did:'d1'}];
let user=null;try{user=JSON.parse(sessionStorage.getItem('clinic-user'))}catch(e){}
const role=()=>user&&user.role;
function loginView(){return`<div class="panel" style="max-width:380px;margin:30px auto"><h2>Log in</h2>${msg?`<div class="msg err" role="alert">${msg}</div>`:''}<form id="lf"><label for="lu">Username</label><input id="lu" autocomplete="username"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password"><p><button class="b" type="submit">Log in</button></p></form><p class="sub">Demo accounts: staff / staff123 (front desk) and drsantos / doctor123 (doctor).</p></div>`}
const v=$('#view');
v.addEventListener('submit',e=>{if(e.target.id!=='lf')return;e.preventDefault();const a=ACC.find(x=>x.u===$('#lu').value.trim()&&x.p===$('#lp').value);if(!a){msg='Wrong username or password. Check both and try again.';render();return}msg='';user={...a,p:undefined};try{sessionStorage.setItem('clinic-user',JSON.stringify(user))}catch(err){}tab='dash';render()});
$('#out').onclick=()=>{user=null;msg='';try{sessionStorage.removeItem('clinic-user')}catch(e){}render()};
v.addEventListener('click',e=>{if(e.target.id==='pr')window.print()});
v.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.slot){draft.time=d.slot;render()}
 else if(d.f){filter=d.f;render()}
 else if(d.p){selP=d.p;render()}
 else if(d.act){const a=S.appts.find(x=>x.id===d.id);a.status=d.act==='done'?'Completed':'Cancelled';save();render()}
 else if(t.id==='bsave'){
  let pid=draft.pid;
  if(pid==='new'){const n=$('#nn').value.trim();if(!n){msg='<span class="err">Enter the new patient\u2019s name.</span>';render();return}
   const p={id:uid('p'),name:n,age:+$('#na').value||0,phone:$('#np').value.trim(),notes:[]};S.patients.push(p);pid=p.id;draft.pid=pid}
  if(!draft.time){msg='<span class="err">Choose a time slot first.</span>';render();return}
  if(taken(draft.did,draft.date,draft.time)){msg='<span class="err">That slot was just taken. Choose another time.</span>';draft.time='';render();return}
  S.appts.push({id:uid('a'),pid,did:draft.did,date:draft.date,time:draft.time,reason:$('#br').value.trim(),status:'Scheduled'});save();
  msg=`Booked: ${esc(P(pid).name)} with ${esc(D(draft.did).name)} on ${fdate(draft.date)} at ${fmt(draft.time)}.`;draft.time='';render()}
 else if(t.id==='radd'){const n=$('#rn').value.trim();if(!n)return;const p={id:uid('p'),name:n,age:+$('#ra').value||0,phone:$('#rp').value.trim(),notes:[]};S.patients.push(p);selP=p.id;save();render()}
 else if(t.id==='nadd'){const x=$('#nt').value.trim();if(!x)return;P(selP).notes.push({date:today(),did:$('#nd').value,text:x});save();render()}
});
v.addEventListener('change',e=>{const i=e.target.id;
 if(i==='bp'){draft.pid=e.target.value;render()}
 else if(i==='bd'){draft.did=e.target.value;draft.time='';render()}
 else if(i==='bdt'){draft.date=e.target.value||addDays(1);draft.time='';render()}});
v.addEventListener('input',e=>{if(e.target.id==='sq'){q=e.target.value;const pos=e.target.selectionStart;render();const s=$('#sq');s.focus();s.setSelectionRange(pos,pos)}});
render();
</script>
</body>
</html>
